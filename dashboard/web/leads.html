<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Intelligence — Ozon CRM</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26314a; --text:#e8edf7;
          --muted:#8fa0bf; --accent:#4f8cff; --good:#3ecf8e; --warn:#ffb020; --bad:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line);
           display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; }
  header a { color:var(--accent); text-decoration:none; }
  main { padding:20px 24px; display:grid; gap:20px; }
  section { background:var(--card); border:1px solid var(--line);
            border-radius:12px; padding:16px 18px; }
  h2 { font-size:15px; margin:0 0 12px; color:var(--muted); font-weight:600;
       text-transform:uppercase; letter-spacing:.04em; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
  .kpi { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .kpi b { display:block; font-size:22px; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .grade { display:inline-block; min-width:22px; text-align:center; border-radius:6px;
           font-weight:700; padding:1px 6px; }
  .grade.A { background:var(--good); color:#06281a; }
  .grade.B { background:var(--accent); color:#0a1a33; }
  .grade.C { background:var(--warn); color:#33230a; }
  .grade.D, .grade.U { background:var(--bad); color:#3a0d0d; }
  .muted { color:var(--muted); }
  .bar { height:8px; border-radius:4px; background:var(--bg); border:1px solid var(--line);
         overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  #err { color:var(--bad); padding:0 24px; }
</style>
</head>
<body>
<header>
  <h1>Lead Intelligence</h1>
  <a href="/">← дашборд</a>
  <button onclick="location.reload()">Обновить</button>
</header>
<div id="err"></div>
<main>
  <section>
    <h2>База продавцов</h2>
    <div class="grid" id="base"></div>
    <div class="grid" id="grades" style="margin-top:12px"></div>
    <p class="muted" id="regions"></p>
  </section>

  <section>
    <h2>Воронка (этапов достигли)</h2>
    <div id="funnel"></div>
  </section>

  <section>
    <h2>Эффективность коммуникаций</h2>
    <div class="grid" id="comms"></div>
  </section>

  <section>
    <h2>Топ лидов (по Commercial Score)</h2>
    <table id="top"><thead><tr>
      <th>Категория</th><th>Магазин</th><th>Коммерч.</th><th>Вовлеч.</th>
      <th>Заказы</th><th>Рейтинг</th><th>Статус</th><th>Задача</th>
    </tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Последние переходы воронки</h2>
    <table id="trans"><thead><tr>
      <th>Когда</th><th>Магазин</th><th>Этап</th><th>Причина</th><th>Кто</th>
    </tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Эксперименты</h2>
    <div id="experiments" class="muted">—</div>
  </section>
</main>

<script>
const esc = (v) => String(v ?? "—").replace(/[<>&"]/g, (c) =>
  ({"<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;"}[c]));

function kpi(label, value, hint = "") {
  return `<div class="kpi"><span class="muted">${esc(label)}</span>` +
         `<b>${esc(value)}</b>${hint ? `<span class="muted">${esc(hint)}</span>` : ""}</div>`;
}

async function load() {
  try {
    const [analytics, top, experiments] = await Promise.all([
      fetch("/api/analytics").then(r => r.json()),
      fetch("/api/leads/top?limit=40").then(r => r.json()),
      fetch("/api/experiments").then(r => r.json()),
    ]);

    // База
    const b = analytics.base || {};
    document.getElementById("base").innerHTML =
      kpi("Всего продавцов", b.total ?? 0) + kpi("Квалифицировано", b.qualified ?? 0);

    const grades = b.grades || {};
    document.getElementById("grades").innerHTML = ["A","B","C","D","U"].map(g =>
      kpi(`Категория ${g}`, grades[g] ?? 0, {A:"высокий приоритет", B:"перспективный",
        C:"средний", D:"низкий", U:"не соответствует"}[g])).join("");

    const regions = Object.entries(b.provinces || {}).slice(0, 5)
      .map(([p, n]) => `${p}: ${n}`).join(" · ");
    document.getElementById("regions").textContent =
      "Регионы (топ-5): " + (regions || "нет данных");

    // Воронка
    const funnel = analytics.funnel || {};
    const labels = {imported:"Импортирован", qualified:"Квалифицирован",
      prioritized:"Приоритизирован", contacted:"Контакт состоялся", replied:"Ответ",
      interested:"Заинтересован", negotiation:"Переговоры", deal:"Сделка",
      lost:"Потерян", "opted_out":"Отказался"};
    const max = Math.max(1, ...Object.values(funnel));
    document.getElementById("funnel").innerHTML = Object.entries(labels).map(([k, l]) =>
      `<div style="margin-bottom:8px"><span>${l}</span> ` +
      `<span class="muted">${funnel[k] ?? 0}</span>` +
      `<div class="bar"><i style="width:${Math.round(100 * (funnel[k] ?? 0) / max)}%"></i></div></div>`
    ).join("");

    // Коммуникации
    const c = analytics.comms || {};
    document.getElementById("comms").innerHTML =
      kpi("Отправлено", c.sent ?? 0) +
      kpi("Получили ответы", c.replied ?? 0) +
      kpi("Положительные", c.positive ?? 0) +
      kpi("Отказы", c.refusals ?? 0) +
      kpi("Переговоры", c.negotiations ?? 0) +
      kpi("Сделки", c.deals ?? 0) +
      kpi("Потеряно", c.lost ?? 0) +
      kpi("Отказались от рассылки", c.opted_out ?? 0);

    // Топ лидов
    const tbody = document.querySelector("#top tbody");
    tbody.innerHTML = (top.rows || []).map(r => `<tr>
      <td><span class="grade ${esc(r.lead_grade || "D")}">${esc(r.lead_grade || "—")}</span></td>
      <td>${esc(r.shop_name)}</td>
      <td>${esc(Math.round(r.commercial_score ?? 0))}</td>
      <td>${esc(Math.round(r.engagement_score ?? 0))}</td>
      <td>${esc((r.orders ?? 0).toLocaleString("ru-RU"))}</td>
      <td>${esc(r.rating ?? 0)}</td>
      <td>${esc(r.status)}</td>
      <td class="muted">${esc(r.next_task || "—")}</td>
    </tr>`).join("") || '<tr><td colspan="8" class="muted">Пересчитайте скоринг: POST /api/leads/recompute</td></tr>';

    // Переходы
    const trows = analytics.transitions || [];
    document.querySelector("#trans tbody").innerHTML = trows.map(t => `<tr>
      <td class="muted">${esc((t.event_at || "").replace("T", " ").slice(0, 16))}</td>
      <td>${esc(t.shop_name || t.seller_id)}</td>
      <td>${esc(labels[t.to_stage] || t.to_stage)}</td>
      <td class="muted">${esc(t.reason || "—")}</td>
      <td class="muted">${esc(t.actor)}</td>
    </tr>`).join("") || '<tr><td colspan="5" class="muted">Переходов пока нет</td></tr>';

    // Эксперименты
    const list = experiments.experiments || [];
    document.getElementById("experiments").innerHTML = list.length
      ? list.map(e => `<div>№${e.id} «${esc(e.name)}» — ${esc(e.status)}, создан ${esc(e.created_at)} ·
          <a href="#" onclick="fetch('/api/experiments?id=${e.id}').then(r=>r.json()).then(d=>alert(JSON.stringify(d.variants, null, 1)));return false;">отчёт</a></div>`).join("")
      : "Экспериментов ещё нет. Создать: POST /api/experiments/create {name, criteria, variants}.";
  } catch (e) {
    document.getElementById("err").textContent = "Ошибка загрузки: " + e;
  }
}
load();
</script>
</body>
</html>
